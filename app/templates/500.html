{% extends 'layout.html' %}
{% block title %}System Error - EduWise{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex flex-col items-center justify-center text-center px-6">
    <div class="w-24 h-24 rounded-2xl flex items-center justify-center text-4xl mb-8"
         style="background: var(--coral-surface); color: var(--coral);">
        <i class="fas fa-exclamation-triangle"></i>
    </div>
    <h1 class="text-4xl font-bold tracking-tight mb-4" style="color: var(--text-primary);">500</h1>
    <p class="text-lg max-w-[460px] mx-auto mb-10" style="color: var(--text-secondary);">
        Something went wrong on our end. Our team has been notified and we're looking into it.
    </p>
    <div class="flex gap-4">
        <a href="{{ url_for('dashboard.home') }}" class="btn-primary">
            Back to Safety
        </a>
    </div>
</div>
{% endblock %}
