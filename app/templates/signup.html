{% extends 'layout.html' %}
{% block title %}Sign Up - EduWise{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center pt-24 pb-20 px-6" style="background: var(--surface-page);">
    <div class="w-full max-w-[400px]">
        
        <div class="text-center mb-8 animate-enter">
            <h1 class="text-[28px] font-semibold tracking-tight mb-2" style="color: var(--text-primary);">Create Account</h1>
            <p class="text-[15px]" style="color: var(--text-secondary);">Join over 1,000 learners today.</p>
        </div>

        <div class="studio-card p-8 animate-enter" style="animation-delay: 80ms;">
            <form method="POST" action="{{ url_for('auth.signup') }}" class="space-y-5">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                
                <div>
                    <label class="label-caps block mb-2">Username</label>
                    <input type="text" name="username" required maxlength="50" class="studio-input" placeholder="Choose a username">
                </div>

                <div>
                    <label class="label-caps block mb-2">Email</label>
                    <input type="email" name="email" required maxlength="100" class="studio-input" placeholder="you@example.com">
                </div>

                <div>
                    <label class="label-caps block mb-2">Password</label>
                    <input type="password" name="password" id="signup-password" required minlength="8" maxlength="100" class="studio-input" placeholder="Min 8 characters">
                    <div id="password-strength" class="mt-2 flex gap-1">
                        <div class="h-1 flex-1 rounded-full transition-colors" style="background: var(--border);"></div>
                        <div class="h-1 flex-1 rounded-full transition-colors" style="background: var(--border);"></div>
                        <div class="h-1 flex-1 rounded-full transition-colors" style="background: var(--border);"></div>
                        <div class="h-1 flex-1 rounded-full transition-colors" style="background: var(--border);"></div>
                    </div>
                    <p id="password-label" class="text-[11px] mt-1" style="color: var(--text-muted);">At least 8 characters required</p>
                </div>

                <div>
                    <label class="label-caps block mb-2">Confirm Password</label>
                    <input type="password" name="confirm_password" id="signup-confirm" required maxlength="100" class="studio-input" placeholder="Re-enter your password">
                    <p id="match-label" class="text-[11px] mt-1 hidden"></p>
                </div>

                <div class="flex items-center gap-3">
                    <input type="checkbox" id="terms" required class="w-4 h-4 rounded cursor-pointer" style="accent-color: var(--accent);">
                    <label for="terms" class="text-[12px]" style="color: var(--text-muted);">I agree to the <a href="#" class="hover:underline font-medium" style="color: var(--accent);">Terms of Service</a></label>
                </div>

                <button type="submit" class="btn-primary w-full mt-2">Join EduWise</button>
            </form>

            <div class="mt-8 pt-6 text-center" style="border-top: 1px solid var(--border);">
                <p class="text-[14px]" style="color: var(--text-muted);">
                    Already a member? 
                    <a href="{{ url_for('auth.login') }}" class="font-semibold hover:underline" style="color: var(--accent);">Log in</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
    const pw = document.getElementById('signup-password');
    const confirm = document.getElementById('signup-confirm');
    const bars = document.querySelectorAll('#password-strength div');
    const label = document.getElementById('password-label');
    const matchLabel = document.getElementById('match-label');

    function getStrength(val) {
        let score = 0;
        if (val.length >= 8) score++;
        if (val.length >= 12) score++;
        if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
        if (/\d/.test(val) && /[^a-zA-Z0-9]/.test(val)) score++;
        return score;
    }

    const colors = ['#E03131', '#E67700', '#2B8A3E', '#2B8A3E'];
    const labels = ['Weak', 'Fair', 'Good', 'Strong'];

    pw.addEventListener('input', function() {
        const s = getStrength(this.value);
        bars.forEach((b, i) => {
            b.style.background = i < s ? colors[s - 1] : 'var(--border)';
        });
        if (this.value.length > 0) {
            label.textContent = s > 0 ? labels[s - 1] : 'Too short';
            label.style.color = s > 0 ? colors[s - 1] : '#E03131';
        } else {
            label.textContent = 'At least 8 characters required';
            label.style.color = 'var(--text-muted)';
        }
        checkMatch();
    });

    function checkMatch() {
        if (confirm.value.length === 0) {
            matchLabel.classList.add('hidden');
            return;
        }
        matchLabel.classList.remove('hidden');
        if (pw.value === confirm.value) {
            matchLabel.textContent = 'Passwords match ✓';
            matchLabel.style.color = '#2B8A3E';
        } else {
            matchLabel.textContent = 'Passwords do not match';
            matchLabel.style.color = '#E03131';
        }
    }

    confirm.addEventListener('input', checkMatch);
})();
</script>
{% endblock %}
