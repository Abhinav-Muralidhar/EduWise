{% extends 'layout.html' %}
{% block title %}Reset Password - EduWise{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center pt-24 pb-20 px-6" style="background: var(--surface-page);">
    <div class="w-full max-w-[400px]">
        
        <div class="text-center mb-8 animate-enter">
            <h1 class="text-[28px] font-semibold tracking-tight mb-2" style="color: var(--text-primary);">Set New Password</h1>
            <p class="text-[15px]" style="color: var(--text-secondary);">Please choose a strong new password.</p>
        </div>

        <div class="studio-card p-8 animate-enter" style="animation-delay: 80ms;">
            <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}" class="space-y-5">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                
                <div>
                    <label class="label-caps block mb-2">New Password</label>
                    <input type="password" name="password" id="reset-password" required minlength="8" maxlength="100" class="studio-input" placeholder="Min 8 characters">
                    <div id="password-strength" class="mt-2 flex gap-1">
                        <div class="h-1 flex-1 rounded-full transition-colors" style="background: var(--border);"></div>
                        <div class="h-1 flex-1 rounded-full transition-colors" style="background: var(--border);"></div>
                        <div class="h-1 flex-1 rounded-full transition-colors" style="background: var(--border);"></div>
                        <div class="h-1 flex-1 rounded-full transition-colors" style="background: var(--border);"></div>
                    </div>
                </div>

                <div>
                    <label class="label-caps block mb-2">Confirm New Password</label>
                    <input type="password" name="confirm_password" id="reset-confirm" required maxlength="100" class="studio-input" placeholder="Re-enter password">
                    <p id="match-label" class="text-[11px] mt-1 hidden"></p>
                </div>

                <button type="submit" class="btn-primary w-full mt-2">Reset Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
    const pw = document.getElementById('reset-password');
    const confirm = document.getElementById('reset-confirm');
    const bars = document.querySelectorAll('#password-strength div');
    const matchLabel = document.getElementById('match-label');

    function getStrength(val) {
        let score = 0;
        if (val.length >= 8) score++;
        if (val.length >= 12) score++;
        if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
        if (/\d/.test(val) && /[^a-zA-Z0-9]/.test(val)) score++;
        return score;
    }

    const colors = ['#E03131', '#E67700', '#2B8A3E', '#2B8A3E'];

    pw.addEventListener('input', function() {
        const s = getStrength(this.value);
        bars.forEach((b, i) => {
            b.style.background = i < s ? colors[s - 1] : 'var(--border)';
        });
        checkMatch();
    });

    function checkMatch() {
        if (confirm.value.length === 0) {
            matchLabel.classList.add('hidden');
            return;
        }
        matchLabel.classList.remove('hidden');
        if (pw.value === confirm.value) {
            matchLabel.textContent = 'Passwords match ✓';
            matchLabel.style.color = '#2B8A3E';
        } else {
            matchLabel.textContent = 'Passwords do not match';
            matchLabel.style.color = '#E03131';
        }
    }

    confirm.addEventListener('input', checkMatch);
})();
</script>
{% endblock %}
