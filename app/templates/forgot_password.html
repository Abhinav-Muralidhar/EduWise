{% extends 'layout.html' %}
{% block title %}Forgot Password - EduWise{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center pt-12 pb-20 px-6" style="background: var(--surface-page);">
    <div class="w-full max-w-[420px]">
        
        <div class="text-center mb-8 animate-enter">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-md mb-4" style="background: var(--accent); color: var(--accent-ink); border: 1.5px solid var(--border-ink); box-shadow: var(--shadow-tactile);">
                <i class="fas fa-key text-lg"></i>
            </div>
            <h1 class="text-3xl font-bold font-heading tracking-tight mb-1" style="color: var(--text-primary);">Reset Password</h1>
            <p class="text-xs sm:text-sm" style="color: var(--text-muted);">Enter your registered email address to receive recovery instructions.</p>
        </div>

        <div class="studio-card p-8 sm:p-9 animate-enter relative overflow-hidden" style="border: 2px solid var(--border-ink); box-shadow: var(--shadow-tactile-lg); animation-delay: 80ms;">
            <form method="POST" action="{{ url_for('auth.forgot_password') }}" id="forgot-form" class="space-y-5">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                
                <div>
                    <label for="forgot-email" class="label-caps block mb-2">Registered Email Address</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-xs" style="color: var(--text-muted);">
                            <i class="fas fa-envelope"></i>
                        </span>
                        <input type="email" 
                               id="forgot-email"
                               name="email" 
                               required 
                               maxlength="100" 
                               autofocus
                               autocomplete="email"
                               class="studio-input pl-10" 
                               placeholder="you@university.edu">
                    </div>
                </div>

                <button type="submit" id="forgot-submit-btn" class="btn-primary w-full py-2.5 mt-2 flex items-center justify-center gap-2">
                    <span id="forgot-btn-text">Send Recovery Link</span>
                    <i class="fas fa-paper-plane text-xs"></i>
                </button>
            </form>

            <div class="mt-8 pt-6 text-center" style="border-top: 1.5px solid var(--border);">
                <p class="text-xs" style="color: var(--text-muted);">
                    Remembered credentials? 
                    <a href="{{ url_for('auth.login') }}" class="font-bold hover:underline ml-1" style="color: var(--accent);">Back to login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
    const form = document.getElementById('forgot-form');
    const submitBtn = document.getElementById('forgot-submit-btn');
    const btnText = document.getElementById('forgot-btn-text');

    if (form && submitBtn) {
        form.addEventListener('submit', function() {
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.85';
            btnText.innerHTML = '<i class="fas fa-circle-notch fa-spin text-xs mr-1"></i> Sending link...';
        });
    }
})();
</script>
{% endblock %}
