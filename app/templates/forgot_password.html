{% extends 'layout.html' %}
{% block title %}Forgot Password - EduWise{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center pt-24 pb-20 px-6" style="background: var(--surface-page);">
    <div class="w-full max-w-[400px]">
        
        <div class="text-center mb-8 animate-enter">
            <h1 class="text-[28px] font-semibold tracking-tight mb-2" style="color: var(--text-primary);">Forgot Password</h1>
            <p class="text-[15px]" style="color: var(--text-secondary);">Enter your email to receive a reset link.</p>
        </div>

        <div class="studio-card p-8 animate-enter" style="animation-delay: 80ms;">
            <form method="POST" action="{{ url_for('auth.forgot_password') }}" class="space-y-5">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                
                <div>
                    <label class="label-caps block mb-2">Email Address</label>
                    <input type="email" name="email" required maxlength="100" class="studio-input" placeholder="you@example.com">
                </div>

                <button type="submit" class="btn-primary w-full mt-2">Send Reset Link</button>
            </form>

            <div class="mt-8 pt-6 text-center" style="border-top: 1px solid var(--border);">
                <p class="text-[14px]" style="color: var(--text-muted);">
                    Remembered your password? 
                    <a href="{{ url_for('auth.login') }}" class="font-semibold hover:underline" style="color: var(--accent);">Back to login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
