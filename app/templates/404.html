{% extends 'layout.html' %}
{% block title %}Page Not Found - EduWise{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex flex-col items-center justify-center text-center px-6">
    <div class="w-24 h-24 rounded-2xl flex items-center justify-center text-4xl mb-8 animate-bounce"
         style="background: var(--accent-surface); color: var(--accent);">
        <i class="fas fa-search"></i>
    </div>
    <h1 class="text-4xl font-bold tracking-tight mb-4" style="color: var(--text-primary);">404</h1>
    <p class="text-lg max-w-[460px] mx-auto mb-10" style="color: var(--text-secondary);">
        Oops! We couldn't find the page you're looking for. It might have been moved or never existed.
    </p>
    <div class="flex gap-4">
        <a href="{{ url_for('dashboard.home') }}" class="btn-primary">
            Take me home
        </a>
    </div>
</div>
{% endblock %}
