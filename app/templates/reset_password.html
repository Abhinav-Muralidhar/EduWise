{% extends 'layout.html' %}
{% block title %}Reset Password - EduWise{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center pt-12 pb-20 px-6" style="background: var(--surface-page);">
    <div class="w-full max-w-[420px]">
        
        <div class="text-center mb-8 animate-enter">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-md mb-4" style="background: var(--accent); color: var(--accent-ink); border: 1.5px solid var(--border-ink); box-shadow: var(--shadow-tactile);">
                <i class="fas fa-lock-open text-lg"></i>
            </div>
            <h1 class="text-3xl font-bold font-heading tracking-tight mb-1" style="color: var(--text-primary);">Set New Password</h1>
            <p class="text-xs sm:text-sm" style="color: var(--text-muted);">Choose a new, secure password for your study account.</p>
        </div>

        <div class="studio-card p-8 sm:p-9 animate-enter relative overflow-hidden" style="border: 2px solid var(--border-ink); box-shadow: var(--shadow-tactile-lg); animation-delay: 80ms;">
            <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}" id="reset-form" class="space-y-4">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                
                <!-- Password Field -->
                <div>
                    <label for="reset-password" class="label-caps block mb-1.5">New Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-xs" style="color: var(--text-muted);">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input type="password" 
                               name="password" 
                               id="reset-password" 
                               required 
                               minlength="8" 
                               maxlength="100" 
                               autofocus
                               autocomplete="new-password"
                               class="studio-input pl-10 pr-11" 
                               placeholder="Min 8 characters">
                        <button type="button" 
                                id="toggle-reset-password" 
                                tabindex="-1"
                                class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-xs transition-colors hover:opacity-100"
                                style="color: var(--text-muted);" 
                                aria-label="Toggle password visibility">
                            <i class="fas fa-eye" id="toggle-reset-icon"></i>
                        </button>
                    </div>

                    <div id="password-strength" class="mt-2 flex gap-1.5">
                        <div class="h-1 flex-1 rounded-full transition-all" style="background: var(--border);"></div>
                        <div class="h-1 flex-1 rounded-full transition-all" style="background: var(--border);"></div>
                        <div class="h-1 flex-1 rounded-full transition-all" style="background: var(--border);"></div>
                        <div class="h-1 flex-1 rounded-full transition-all" style="background: var(--border);"></div>
                    </div>
                    <p id="password-label" class="text-[11px] font-mono mt-1" style="color: var(--text-muted);">Min 8 characters required</p>
                </div>

                <!-- Confirm Field -->
                <div>
                    <label for="reset-confirm" class="label-caps block mb-1.5">Confirm New Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-xs" style="color: var(--text-muted);">
                            <i class="fas fa-shield-alt"></i>
                        </span>
                        <input type="password" 
                               name="confirm_password" 
                               id="reset-confirm" 
                               required 
                               maxlength="100" 
                               autocomplete="new-password"
                               class="studio-input pl-10 pr-11" 
                               placeholder="Re-enter password">
                        <button type="button" 
                                id="toggle-reset-confirm" 
                                tabindex="-1"
                                class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-xs transition-colors hover:opacity-100"
                                style="color: var(--text-muted);" 
                                aria-label="Toggle confirm password visibility">
                            <i class="fas fa-eye" id="toggle-reset-confirm-icon"></i>
                        </button>
                    </div>
                    <p id="match-label" class="text-[11px] font-mono mt-1 hidden"></p>
                </div>

                <button type="submit" id="reset-submit-btn" class="btn-primary w-full py-2.5 mt-2 flex items-center justify-center gap-2">
                    <span id="reset-btn-text">Update Password</span>
                    <i class="fas fa-check text-xs"></i>
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
    const pw = document.getElementById('reset-password');
    const confirm = document.getElementById('reset-confirm');
    const bars = document.querySelectorAll('#password-strength div');
    const label = document.getElementById('password-label');
    const matchLabel = document.getElementById('match-label');
    const form = document.getElementById('reset-form');
    const submitBtn = document.getElementById('reset-submit-btn');
    const btnText = document.getElementById('reset-btn-text');

    function setupToggle(inputEl, btnEl, iconEl) {
        if (!inputEl || !btnEl || !iconEl) return;
        btnEl.addEventListener('click', function(e) {
            e.preventDefault();
            const isPassword = inputEl.type === 'password';
            inputEl.type = isPassword ? 'text' : 'password';
            iconEl.className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
            btnEl.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
        });
    }

    setupToggle(
        pw, 
        document.getElementById('toggle-reset-password'), 
        document.getElementById('toggle-reset-icon')
    );
    setupToggle(
        confirm, 
        document.getElementById('toggle-reset-confirm'), 
        document.getElementById('toggle-reset-confirm-icon')
    );

    function getStrength(val) {
        let score = 0;
        if (val.length >= 8) score++;
        if (val.length >= 12) score++;
        if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
        if (/\d/.test(val) || /[^a-zA-Z0-9]/.test(val)) score++;
        return score;
    }

    const colors = ['#DC3545', '#B8730E', '#2B6B4F', '#2B6B4F'];
    const labels = ['Weak (add length & symbols)', 'Fair (good progress)', 'Good password', 'Strong password!'];

    pw.addEventListener('input', function() {
        const s = getStrength(this.value);
        bars.forEach((b, i) => {
            b.style.background = i < s ? colors[s - 1] : 'var(--border)';
        });
        if (this.value.length > 0) {
            label.textContent = s > 0 ? labels[s - 1] : 'Too short';
            label.style.color = s > 0 ? colors[s - 1] : '#DC3545';
        } else {
            label.textContent = 'Min 8 characters required';
            label.style.color = 'var(--text-muted)';
        }
        checkMatch();
    });

    function checkMatch() {
        if (!confirm.value.length) {
            matchLabel.classList.add('hidden');
            return;
        }
        matchLabel.classList.remove('hidden');
        if (pw.value === confirm.value) {
            matchLabel.innerHTML = '<i class="fas fa-check-circle mr-1"></i> Passwords match';
            matchLabel.style.color = 'var(--olive)';
        } else {
            matchLabel.innerHTML = '<i class="fas fa-times-circle mr-1"></i> Passwords do not match';
            matchLabel.style.color = 'var(--coral)';
        }
    }

    confirm.addEventListener('input', checkMatch);

    if (form && submitBtn) {
        form.addEventListener('submit', function() {
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.85';
            btnText.innerHTML = '<i class="fas fa-circle-notch fa-spin text-xs mr-1"></i> Updating password...';
        });
    }
})();
</script>
{% endblock %}
